<script src="script.js">// Get the header element by ID
const header = document.getElementById("cs-header-108");

// Listen for the scroll event on the window
window.onscroll = function() {
  // Check if the page is scrolled down from the top
  if (window.scrollY > 0) {
    // Add the 'sticky' class when the user scrolls
    header.classList.add("sticky");
  } else {
    // Remove the 'sticky' class when the user scrolls back to the top
    header.classList.remove("sticky");
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  emailjs.init({
    publicKey: "mqNEO72S-VqHGFxYF"
  });

  const form = document.getElementById("cs-form-1105");

  if (!form) {
    console.error("Contact form not found.");
    return;
  }

  const submitButton = form.querySelector(".cs-submit");

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const selectedServices = Array.from(
      document.querySelectorAll('input[name="service-needed"]:checked')
    )
      .map(function (checkbox) {
        return checkbox.value;
      })
      .join(", ");

    const templateParams = {
      name: document.getElementById("name-1105").value,
      email: document.getElementById("email-1105").value,
      company: document.getElementById("company-1105").value,
      phone: document.getElementById("phone-1105").value,
      address: document.getElementById("address-1105").value,
      estimated_tags: document.getElementById("tags-1105").value,
      service_needed: selectedServices || "Not selected",
      message: document.getElementById("message-1105").value,
      to_email: "afterhourstestingandtagging@gmail.com"
    };

    console.log("Sending these details to EmailJS:", templateParams);

    submitButton.disabled = true;
    submitButton.textContent = "SENDING...";

    emailjs.send("service_w4fwqyn", "template_cjn1nno", templateParams)
      .then(function (response) {
        console.log("EmailJS success:", response);
        alert("Your inquiry has been sent successfully.");
        form.reset();
      })
      .catch(function (error) {
        console.error("EmailJS Error Status:", error.status);
        console.error("EmailJS Error Text:", error.text);
        console.error("EmailJS Full Error:", error);

        alert("Failed to send. Error: " + (error.text || error.status));
      })
      .finally(function () {
        submitButton.disabled = false;
        submitButton.textContent = "GET A FREE QUOTE";
      });
  });
});
</script>
